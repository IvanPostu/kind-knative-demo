apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-broker-controller
  namespace: knative-eventing
  labels:
    rabbitmq.eventing.knative.dev/release: "v1.15.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq-broker-controller
  template:
    metadata:
      labels:
        app: rabbitmq-broker-controller
        eventing.knative.dev/release: devel
    spec:
      serviceAccountName: eventing-controller
      containers:
        - name: rabbitmq-broker-controller
          terminationMessagePolicy: FallbackToLogsOnError
          image: gcr.io/knative-releases/knative.dev/eventing-rabbitmq/cmd/controller/broker@sha256:8e23a2f9a4fa1d9992b62ac76a9c0cb02d6618ca1ba55c635c63fb88023cd5f2
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
          env:
            - name: SYSTEM_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONFIG_LOGGING_NAME
              value: config-logging
            - name: CONFIG_OBSERVABILITY_NAME
              value: config-observability
            - name: METRICS_DOMAIN
              value: knative.dev/eventing
            # Broker
            - name: BROKER_INGRESS_IMAGE
              value: gcr.io/knative-releases/knative.dev/eventing-rabbitmq/cmd/ingress@sha256:a8f52a4d2c842cd8853143b27b1f35a3ebc96147ad60efd50284e2e308918621
            - name: BROKER_INGRESS_SERVICE_ACCOUNT
              value: eventing-broker-ingress
            - name: BROKER_DISPATCHER_IMAGE
              value: gcr.io/knative-releases/knative.dev/eventing-rabbitmq/cmd/dispatcher@sha256:7a431f43033f631b5d2f2475a2c71fa0c1ad9f1dd6cbc78470f0f39f577ce16c
            - name: BROKER_DLQ_DISPATCHER_IMAGE
              value: gcr.io/knative-releases/knative.dev/eventing-rabbitmq/cmd/dispatcher@sha256:7a431f43033f631b5d2f2475a2c71fa0c1ad9f1dd6cbc78470f0f39f577ce16c
            - name: BROKER_DISPATCHER_SERVICE_ACCOUNT
              value: eventing-broker-filter
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BROKER_IMAGE_PULL_SECRET_NAME
              value:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - all
          ports:
            - name: metrics
              containerPort: 9090
            - name: profiling
              containerPort: 8008

