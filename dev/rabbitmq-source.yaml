apiVersion: sources.knative.dev/v1alpha1
kind: RabbitmqSource
metadata:
  name: rmq-source
  namespace: myapp
spec:
  rabbitmqClusterReference:
    connectionSecret:
      name: myapp-rabbitmq-secret
  rabbitmqResourcesConfig:
    queueName: q.main
    vhost: /
    parallelism: 1
    predeclared: true
  delivery:
    retry: 5
    backoffPolicy: linear
    backoffDelay: PT1S
  sink:
    ref:
      apiVersion: sinks.knative.dev/v1alpha1
      kind: JobSink
      name: job-sink-logger
