apiVersion: sinks.knative.dev/v1alpha1
kind: JobSink
metadata:
  name: event-job-sink
  namespace: myapp
spec:
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: event-consumer
              image: alpine:3.20
              command:
                - /bin/sh
                - -c
                - |
                  echo "Event consumed"
                  echo "Event JSON:"
                  cat /event/event.json
              volumeMounts:
                - name: event
                  mountPath: /event
          volumes:
            - name: event
              emptyDir: {}
