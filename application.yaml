apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myapp-demo
  namespace: myapp
spec:
  project: default
  source:
    repoURL: https://github.com/IvanPostu/kind-knative-demo.git
    targetRevision: HEAD
    path: dev
  destination:
    server: https://kubernetes.default.svc
    namespace: myapp

  syncPolicy:
    syncOptions:
      - CreateNamespace=true

    automated:
      selfHeal: true
      prune: true
